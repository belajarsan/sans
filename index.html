<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheering For WoWo - Mega Fireworks</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }

        /* Container Utama di Tengah Layar */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3;
            width: 90%;
            max-width: 600px;
            pointer-events: none;
        }

        /* Foto Bulat dengan Latar Belakang Agak Transparan */
        #bg-image {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 50%;
            /* Latar belakang semi-transparan dengan efek blur */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 3px solid rgba(255, 105, 180, 0.5);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.6);
            opacity: 0.85; /* Dibuat agak transparan */
            margin-bottom: 25px;
        }

        /* Canvas Kembang Api di latar belakang */
        #fireworks-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
            pointer-events: none;
        }
        
        /* Teks di Tengah dan Terpusat */
        #message-container {
            text-align: center;
            color: #ff69b4; 
            font-family: 'Arial', sans-serif;
            text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 25px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            width: 100%;
            box-sizing: border-box;
        }
        
        h1 { font-size: 2.2em; margin: 0; }
        p { font-size: 1.5em; margin: 8px 0 0 0; }

        @media (max-width: 600px) {
            #bg-image { width: 210px; height: 210px; }
            h1 { font-size: 1.3em; }
            p { font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>
    
    <!-- Bungkus Foto dan Teks agar Posisi Pasti di Tengah -->
    <div class="center-container">
        <img id="bg-image" src="image.png" alt="WoWo">
        
        <div id="message-container">
            <h1>“Whatever happens, I’m always cheering for you.”</h1>
            <p>(For WoWo)</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        class Rocket {
            constructor(targetX, targetY) {
                this.x = Math.random() * width;
                this.y = height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 12;
                this.angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                this.brightness = Math.random() * 30 + 70;
            }
            update(index) {
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                this.x += vx;
                this.y += vy;

                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < this.speed) {
                    createMegaBurst(this.targetX, this.targetY);
                    rockets.splice(index, 1);
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${Math.random() * 60 + 330}, 100%, ${this.brightness}%)`;
                ctx.fill();
            }
        }

        class Sparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 10 + 2;
                this.friction = 0.94;
                this.gravity = 0.12;
                this.alpha = 1;
                this.decay = Math.random() * 0.012 + 0.008;
                this.color = `hsl(${Math.random() * 60 + 320}, 100%, ${Math.random() * 30 + 60}%)`;
                this.size = Math.random() * 2.5 + 1;
            }
            update(index) {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                if (this.alpha <= 0) sparkles.splice(index, 1);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let rockets = [];
        let sparkles = [];

        function createMegaBurst(x, y) {
            for (let i = 0; i < 45; i++) {
                sparkles.push(new Sparkle(x, y));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            if (rockets.length < 25) {
                let centerX = width / 2;
                let centerY = height / 2 - 50;
                let radius = 170 + Math.random() * 70;
                let angle = Math.random() * Math.PI * 2;
                
                let targetX = centerX + Math.cos(angle) * radius;
                let targetY = centerY + Math.sin(angle) * radius;
                
                rockets.push(new Rocket(targetX, targetY));
            }

            rockets.forEach((r, index) => {
                r.update(index);
                r.draw();
            });

            sparkles.forEach((s, index) => {
                s.update(index);
                s.draw();
            });
        }

        animate();
    </script>
</body>
</html>
