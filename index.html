<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Stickman Runner - Mobile Edition</title>
    <style>
        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }
        h2 {
            margin-bottom: 2px;
            font-size: 18px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            letter-spacing: 2px;
        }
        .author {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }
        canvas {
            background: linear-gradient(to bottom, #090a16 0%, #1a1c38 100%);
            display: block;
            margin: 10px auto;
            border-radius: 12px;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            max-width: 100%;
            height: auto;
        }
        .controls-info {
            font-size: 11px;
            color: #a5b4fc;
            margin-bottom: 10px;
        }
        /* Tombol Kontrol Layar HP */
        .touch-controls {
            display: flex;
            justify-content: space-between;
            max-width: 800px;
            margin: 15px auto 0 auto;
            padding: 0 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .game-btn {
            background: rgba(17, 24, 39, 0.8);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-btn:active {
            background: #00ffcc;
            color: #05050a;
            box-shadow: 0 0 20px #00ffcc;
        }
        .jump-btn {
            border-color: #facc15;
            color: #facc15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }
        .jump-btn:active {
            background: #facc15;
            color: #05050a;
            box-shadow: 0 0 20px #facc15;
        }
    </style>
</head>
<body>

    <h2>⚡ CYBER STICKMAN RUNNER ⚡</h2>
    <div class="author">By: Sans</div>
    <div class="controls-info">Gunakan Tombol di Bawah (HP) atau Keyboard (PC)!</div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Tombol Kontrol Virtual untuk HP -->
    <div class="touch-controls">
        <div class="btn-group">
            <div class="game-btn" id="leftBtn">◀</div>
            <div class="game-btn" id="rightBtn">▶</div>
        </div>
        <div class="btn-group">
            <div class="game-btn jump-btn" id="jumpBtn">▲</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let coins = 0;
        let lives = 3;
        let gameOver = false;
        let gameWin = false;

        const keys = { right: false, left: false };

        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowRight") keys.right = true;
            if (e.code === "ArrowLeft") keys.left = true;
            if (e.code === "ArrowUp" || e.code === "Space") {
                triggerJumpOrRestart();
                e.preventDefault();
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowRight") keys.right = false;
            if (e.code === "ArrowLeft") keys.left = false;
        });

        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");
        const jumpBtn = document.getElementById("jumpBtn");

        leftBtn.addEventListener("touchstart", (e) => { keys.left = true; e.preventDefault(); });
        leftBtn.addEventListener("touchend", (e) => { keys.left = false; e.preventDefault(); });
        leftBtn.addEventListener("mousedown", () => { keys.left = true; });
        leftBtn.addEventListener("mouseup", () => { keys.left = false; });

        rightBtn.addEventListener("touchstart", (e) => { keys.right = true; e.preventDefault(); });
        rightBtn.addEventListener("touchend", (e) => { keys.right = false; e.preventDefault(); });
        rightBtn.addEventListener("mousedown", () => { keys.right = true; });
        rightBtn.addEventListener("mouseup", () => { keys.right = false; });

        jumpBtn.addEventListener("touchstart", (e) => { triggerJumpOrRestart(); e.preventDefault(); });
        jumpBtn.addEventListener("mousedown", () => { triggerJumpOrRestart(); });

        function triggerJumpOrRestart() {
            if (gameOver || gameWin) {
                resetFullGame();
                return;
            }
            if (!mario.isJumping) {
                mario.vy = mario.jumpPower;
                mario.isJumping = true;
            }
        }

        const mario = {
            x: 50,
            y: 250,
            width: 28,
            height: 48,
            speed: 5,
            vy: 0,
            gravity: 0.6,
            jumpPower: -12.5,
            isJumping: false,
            animFrame: 0
        };

        let cameraX = 0;
        const worldWidth = 5000;

        const platforms = [
            { x: 300, y: 220, width: 90, height: 20, type: 'block' },
            { x: 420, y: 160, width: 80, height: 20, type: 'block' },
            { x: 570, y: 240, width: 60, height: 80, type: 'pipe' },
            { x: 750, y: 210, width: 120, height: 20, type: 'block' },
            { x: 950, y: 150, width: 90, height: 20, type: 'block' },
            { x: 1120, y: 220, width: 70, height: 100, type: 'pipe' },
            { x: 1300, y: 180, width: 110, height: 20, type: 'block' },
            { x: 1500, y: 130, width: 80, height: 20, type: 'block' },
            { x: 1680, y: 210, width: 65, height: 110, type: 'pipe' },
            { x: 1900, y: 170, width: 130, height: 20, type: 'block' },
            { x: 2150, y: 220, width: 90, height: 20, type: 'block' },
            { x: 2320, y: 150, width: 100, height: 20, type: 'block' },
            { x: 2550, y: 200, width: 70, height: 120, type: 'pipe' },
            { x: 2800, y: 170, width: 120, height: 20, type: 'block' },
            { x: 3050, y: 130, width: 100, height: 20, type: 'block' },
            { x: 3280, y: 210, width: 70, height: 110, type: 'pipe' },
            { x: 3500, y: 170, width: 140, height: 20, type: 'block' },
            { x: 3800, y: 140, width: 100, height: 20, type: 'block' },
            { x: 4100, y: 180, width: 120, height: 20, type: 'block' }
        ];

        const spikes = [
            { x: 680, y: 290, width: 45, height: 20 },
            { x: 1250, y: 290, width: 45, height: 20 },
            { x: 1820, y: 290, width: 60, height: 20 },
            { x: 2450, y: 290, width: 50, height: 20 },
            { x: 2950, y: 290, width: 55, height: 20 },
            { x: 3680, y: 290, width: 70, height: 20 },
            { x: 4300, y: 290, width: 90, height: 20 }
        ];

        let coinList = [
            { x: 320, y: 170, collected: false }, { x: 355, y: 170, collected: false },
            { x: 445, y: 110, collected: false }, { x: 480, y: 110, collected: false },
            { x: 780, y: 160, collected: false }, { x: 820, y: 160, collected: false },
            { x: 975, y: 100, collected: false }, { x: 1330, y: 130, collected: false },
            { x: 1530, y: 80, collected: false },  { x: 1930, y: 120, collected: false },
            { x: 2350, y: 100, collected: false }, { x: 2830, y: 120, collected: false },
            { x: 3080, y: 80, collected: false },  { x: 3530, y: 120, collected: false },
            { x: 3830, y: 90, collected: false },  { x: 4130, y: 130, collected: false },
            { x: 4500, y: 150, collected: false }, { x: 4540, y: 150, collected: false }
        ];

        let enemies = [
            { x: 500, y: 280, width: 32, height: 32, speed: 1.6, direction: 1, minX: 420, maxX: 650, alive: true },
            { x: 1000, y: 280, width: 32, height: 32, speed: 1.8, direction: -1, minX: 850, maxX: 1100, alive: true },
            { x: 1600, y: 280, width: 32, height: 32, speed: 2.0, direction: 1, minX: 1450, maxX: 1750, alive: true },
            { x: 2200, y: 280, width: 32, height: 32, speed: 2.2, direction: -1, minX: 2000, maxX: 2300, alive: true },
            { x: 2700, y: 280, width: 32, height: 32, speed: 2.1, direction: 1, minX: 2550, maxX: 2850, alive: true },
            { x: 3400, y: 280, width: 32, height: 32, speed: 2.4, direction: -1, minX: 3250, maxX: 3550, alive: true },
            { x: 3950, y: 280, width: 32, height: 32, speed: 2.5, direction: 1, minX: 3800, maxX: 4100, alive: true },
            { x: 4600, y: 280, width: 32, height: 32, speed: 2.6, direction: -1, minX: 4400, maxX: 4750, alive: true }
        ];

        const flag = { x: 4850, y: 90, width: 18, height: 230 };

        function resetPosition() {
            mario.x = 50;
            mario.y = 250;
            mario.vy = 0;
            mario.isJumping = false;
            cameraX = 0;
        }

        function resetFullGame() {
            score = 0;
            coins = 0;
            lives = 3;
            gameOver = false;
            gameWin = false;
            resetPosition();
            coinList.forEach(c => c.collected = false);
            enemies.forEach(e => e.alive = true);
        }

        function update() {
            if (gameOver || gameWin) return;

            if (keys.right) {
                mario.x += mario.speed;
                mario.animFrame += 0.2;
            }
            if (keys.left) {
                mario.x -= mario.speed;
                mario.animFrame += 0.2;
                if (mario.x < 0) mario.x = 0;
            }

            cameraX = mario.x - 250;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            mario.vy += mario.gravity;
            mario.y += mario.vy;

            if (mario.y >= 280) {
                mario.y = 280;
                mario.vy = 0;
                mario.isJumping = false;
            }

            platforms.forEach(p => {
                if (
                    mario.x < p.x + p.width &&
                    mario.x + mario.width > p.x &&
                    mario.y + mario.height >= p.y &&
                    mario.y + mario.height - mario.vy <= p.y
                ) {
                    mario.y = p.y - mario.height;
                    mario.vy = 0;
                    mario.isJumping = false;
                }
            });

            spikes.forEach(s => {
                if (
                    mario.x < s.x + s.width &&
                    mario.x + mario.width > s.x &&
                    mario.y + mario.height >= s.y &&
                    mario.y < s.y + s.height
                ) {
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        resetPosition();
                    }
                }
            });

            coinList.forEach(c => {
                if (!c.collected &&
                    mario.x < c.x + 20 &&
                    mario.x + mario.width > c.x &&
                    mario.y < c.y + 20 &&
                    mario.y + mario.height > c.y
                ) {
                    c.collected = true;
                    coins++;
                    score += 250;
                }
            });

            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                enemy.x += enemy.speed * enemy.direction;
                if (enemy.x < enemy.minX || enemy.x > enemy.maxX) {
                    enemy.direction *= -1;
                }

                if (
                    mario.x < enemy.x + enemy.width &&
                    mario.x + mario.width > enemy.x &&
                    mario.y < enemy.y + enemy.height &&
                    mario.y + mario.height > enemy.y
                ) {
                    if (mario.vy > 0 && mario.y + mario.height - mario.vy <= enemy.y + 12) {
                        enemy.alive = false;
                        mario.vy = -9;
                        score += 150;
                    } else {
                        lives--;
                        if (lives <= 0) {
                            gameOver = true;
                        } else {
                            resetPosition();
                        }
                    }
                }
            });

            if (
                mario.x < flag.x + flag.width &&
                mario.x + mario.width > flag.x &&
                mario.y < flag.y + flag.height &&
                mario.y + mario.height > flag.y
            ) {
                gameWin = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            for (let i = 100; i < worldWidth; i += 200) {
                ctx.fillRect(i, 50, 3, 3);
                ctx.fillRect(i + 90, 120, 2, 2);
            }

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 310, worldWidth, 90);
            
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.shadowColor = "#00ffcc";
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(0, 310);
            ctx.lineTo(worldWidth, 310);
            ctx.stroke();
            ctx.shadowBlur = 0;

            spikes.forEach(s => {
                ctx.fillStyle = "#ef4444";
                ctx.shadowColor = "#ef4444";
                ctx.shadowBlur = 12;
                ctx.beginPath();
                let spikeCount = 4;
                let w = s.width / spikeCount;
                for (let i = 0; i < spikeCount; i++) {
                    ctx.moveTo(s.x + (i * w), s.y + s.height);
                    ctx.lineTo(s.x + (i * w) + (w / 2), s.y);
                    ctx.lineTo(s.x + ((i + 1) * w), s.y + s.height);
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            platforms.forEach(p => {
                if (p.type === 'pipe') {
                    ctx.fillStyle = "#1e1b4b";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = "#8b5cf6";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#8b5cf6";
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    ctx.fillRect(p.x - 4, p.y, p.width + 8, 16);
                    ctx.strokeRect(p.x - 4, p.y, p.width + 8, 16);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = "#111827";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = "#38bdf8";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#38bdf8";
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    ctx.shadowBlur = 0;
                }
            });

            coinList.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = "#facc15";
                    ctx.shadowColor = "#facc15";
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(c.x + 10, c.y + 10, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            enemies.forEach(enemy => {
                if (enemy.alive) {
                    ctx.fillStyle = "#dc2626";
                    ctx.shadowColor = "#ef4444";
                    ctx.shadowBlur = 12;
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "#fff";
                    ctx.fillRect(enemy.x + 6, enemy.y + 8, 6, 6);
                    ctx.fillRect(enemy.x + 20, enemy.y + 8, 6, 6);
                }
            });

            ctx.fillStyle = "#fff";
            ctx.shadowColor = "#fff";
            ctx.shadowBlur = 10;
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
            
            ctx.fillStyle = "#00ffcc";
            ctx.shadowColor = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(flag.x - 35, flag.y);
            ctx.lineTo(flag.x, flag.y + 18);
            ctx.lineTo(flag.x - 35, flag.y + 36);
            ctx.fill();
            ctx.shadowBlur = 0;

            const cx = mario.x + mario.width / 2;
            const cy = mario.y;

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 12;

            ctx.beginPath();
            ctx.arc(cx, cy + 8, 8, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, cy + 16);
            ctx.lineTo(cx, cy + 32);
            ctx.stroke();

            let swing = Math.sin(mario.animFrame) * 8;

            ctx.beginPath();
            ctx.moveTo(cx, cy + 20);
            ctx.lineTo(cx - 10 + swing, cy + 28);
            ctx.moveTo(cx, cy + 20);
            ctx.lineTo(cx + 10 - swing, cy + 28);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, cy + 32);
            ctx.lineTo(cx - 10 - swing, cy + 48);
            ctx.moveTo(cx, cy + 32);
            ctx.lineTo(cx + 10 + swing, cy + 48);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.restore();

            ctx.fillStyle = "rgba(17, 24, 39, 0.9)";
            ctx.fillRect(15, 15, 380, 42);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(15, 15, 380, 42);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px 'Courier New'";
            ctx.fillText("SCORE: " + score, 25, 41);
            ctx.fillText("COINS: " + coins, 150, 41);
            ctx.fillText("LIVES: " + "❤️ ".repeat(lives), 260, 41);

            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 10, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ef4444";
                ctx.shadowColor = "#ef4444";
                ctx.shadowBlur = 15;
                ctx.font = "bold 35px 'Courier New'";
                ctx.fillText("SYSTEM FAILURE", 250, 180);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#94a3b8";
                ctx.font = "14px 'Courier New'";
                ctx.fillText("Sentuh tombol Lompat / SPASI untuk Ulangi", 215, 230);
            }

            if (gameWin) {
                ctx.fillStyle = "rgba(5, 5, 10, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.shadowColor = "#00ffcc";
                ctx.shadowBlur = 15;
                ctx.font = "bold 35px 'Courier New'";
                ctx.fillText("MISSION COMPLETE", 230, 180);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#94a3b8";
                ctx.font = "14px 'Courier New'";
                ctx.fillText("Sentuh tombol Lompat / SPASI untuk Main Lagi", 210, 230);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
