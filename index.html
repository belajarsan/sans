<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Stickman Runner - Epic Long Edition</title>
    <style>
        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            letter-spacing: 2px;
        }
        .author {
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
            letter-spacing: 1px;
        }
        canvas {
            background: linear-gradient(to bottom, #090a16 0%, #1a1c38 100%);
            display: block;
            margin: 20px auto;
            border-radius: 12px;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
        }
        .controls {
            font-size: 13px;
            color: #a5b4fc;
            margin-top: 10px;
            background: #111827;
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #1f2937;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>⚡ CYBER STICKMAN RUNNER : ULTIMATE ADVENTURE ⚡</h2>
    <div class="author">By: Sans</div>
    <div class="controls">Gunakan <b>Panah Kiri / Kanan</b> untuk bergerak, <b>Spasi / Panah Atas</b> untuk melompat & Restart. Hindari Duri Laser Merah!</div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Status Game
        let score = 0;
        let coins = 0;
        let lives = 3;
        let gameOver = false;
        let gameWin = false;

        // Tombol Keyboard
        const keys = { right: false, left: false };

        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowRight") keys.right = true;
            if (e.code === "ArrowLeft") keys.left = true;
            if (e.code === "ArrowUp" || e.code === "Space") {
                if (gameOver || gameWin) {
                    resetFullGame();
                    e.preventDefault();
                    return;
                }
                if (!mario.isJumping) {
                    mario.vy = mario.jumpPower;
                    mario.isJumping = true;
                }
                e.preventDefault();
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowRight") keys.right = false;
            if (e.code === "ArrowLeft") keys.left = false;
        });

        // Karakter Stickman
        const mario = {
            x: 50,
            y: 250,
            width: 28,
            height: 48,
            speed: 5,
            vy: 0,
            gravity: 0.6,
            jumpPower: -12.5,
            isJumping: false,
            animFrame: 0
        };

        // Kamera & Dunia Jauh (Panjang 5000 Pixel)
        let cameraX = 0;
        const worldWidth = 5000;

        // Platform & Pipa Beragam & Banyak
        const platforms = [
            { x: 300, y: 220, width: 90, height: 20, type: 'block' },
            { x: 420, y: 160, width: 80, height: 20, type: 'block' },
            { x: 570, y: 240, width: 60, height: 80, type: 'pipe' },
            { x: 750, y: 210, width: 120, height: 20, type: 'block' },
            { x: 950, y: 150, width: 90, height: 20, type: 'block' },
            { x: 1120, y: 220, width: 70, height: 100, type: 'pipe' },
            { x: 1300, y: 180, width: 110, height: 20, type: 'block' },
            { x: 1500, y: 130, width: 80, height: 20, type: 'block' },
            { x: 1680, y: 210, width: 65, height: 110, type: 'pipe' },
            { x: 1900, y: 170, width: 130, height: 20, type: 'block' },
            { x: 2150, y: 220, width: 90, height: 20, type: 'block' },
            { x: 2320, y: 150, width: 100, height: 20, type: 'block' },
            { x: 2550, y: 200, width: 70, height: 120, type: 'pipe' },
            { x: 2800, y: 170, width: 120, height: 20, type: 'block' },
            { x: 3050, y: 130, width: 100, height: 20, type: 'block' },
            { x: 3280, y: 210, width: 70, height: 110, type: 'pipe' },
            { x: 3500, y: 170, width: 140, height: 20, type: 'block' },
            { x: 3800, y: 140, width: 100, height: 20, type: 'block' },
            { x: 4100, y: 180, width: 120, height: 20, type: 'block' }
        ];

        // Rintangan Duri Laser Merah di Tanah
        const spikes = [
            { x: 680, y: 290, width: 45, height: 20 },
            { x: 1250, y: 290, width: 45, height: 20 },
            { x: 1820, y: 290, width: 60, height: 20 },
            { x: 2450, y: 290, width: 50, height: 20 },
            { x: 2950, y: 290, width: 55, height: 20 },
            { x: 3680, y: 290, width: 70, height: 20 },
            { x: 4300, y: 290, width: 90, height: 20 }
        ];

        // Sebaran Koin Cyber Banyak
        let coinList = [
            { x: 320, y: 170, collected: false }, { x: 355, y: 170, collected: false },
            { x: 445, y: 110, collected: false }, { x: 480, y: 110, collected: false },
            { x: 780, y: 160, collected: false }, { x: 820, y: 160, collected: false },
            { x: 975, y: 100, collected: false }, { x: 1330, y: 130, collected: false },
            { x: 1530, y: 80, collected: false },  { x: 1930, y: 120, collected: false },
            { x: 2350, y: 100, collected: false }, { x: 2830, y: 120, collected: false },
            { x: 3080, y: 80, collected: false },  { x: 3530, y: 120, collected: false },
            { x: 3830, y: 90, collected: false },  { x: 4130, y: 130, collected: false },
            { x: 4500, y: 150, collected: false }, { x: 4540, y: 150, collected: false }
        ];

        // Musuh Cyber Sepanjang Lintasan
        let enemies = [
            { x: 500, y: 280, width: 32, height: 32, speed: 1.6, direction: 1, minX: 420, maxX: 650, alive: true },
            { x: 1000, y: 280, width: 32, height: 32, speed: 1.8, direction: -1, minX: 850, maxX: 1100, alive: true },
            { x: 1600, y: 280, width: 32, height: 32, speed: 2.0, direction: 1, minX: 1450, maxX: 1750, alive: true },
            { x: 2200, y: 280, width: 32, height: 32, speed: 2.2, direction: -1, minX: 2000, maxX: 2300, alive: true },
            { x: 2700, y: 280, width: 32, height: 32, speed: 2.1, direction: 1, minX: 2550, maxX: 2850, alive: true },
            { x: 3400, y: 280, width: 32, height: 32, speed: 2.4, direction: -1, minX: 3250, maxX: 3550, alive: true },
            { x: 3950, y: 280, width: 32, height: 32, speed: 2.5, direction: 1, minX: 3800, maxX: 4100, alive: true },
            { x: 4600, y: 280, width: 32, height: 32, speed: 2.6, direction: -1, minX: 4400, maxX: 4750, alive: true }
        ];

        // Tiang Finish di Ujung Peta
        const flag = { x: 4850, y: 90, width: 18, height: 230 };

        function resetPosition() {
            mario.x = 50;
            mario.y = 250;
            mario.vy = 0;
            mario.isJumping = false;
            cameraX = 0;
        }

        function resetFullGame() {
            score = 0;
            coins = 0;
            lives = 3;
            gameOver = false;
            gameWin = false;
            resetPosition();
            coinList.forEach(c => c.collected = false);
            enemies.forEach(e => e.alive = true);
        }

        function update() {
            if (gameOver || gameWin) return;

            if (keys.right) {
                mario.x += mario.speed;
                mario.animFrame += 0.2;
            }
            if (keys.left) {
                mario.x -= mario.speed;
                mario.animFrame += 0.2;
                if (mario.x < 0) mario.x = 0;
            }

            cameraX = mario.x - 250;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            mario.vy += mario.gravity;
            mario.y += mario.vy;

            if (mario.y >= 280) {
                mario.y = 280;
                mario.vy = 0;
                mario.isJumping = false;
            }

            // Tabrakan Platform
            platforms.forEach(p => {
                if (
                    mario.x < p.x + p.width &&
                    mario.x + mario.width > p.x &&
                    mario.y + mario.height >= p.y &&
                    mario.y + mario.height - mario.vy <= p.y
                ) {
                    mario.y = p.y - mario.height;
                    mario.vy = 0;
                    mario.isJumping = false;
                }
            });

            // Cek Tabrakan Duri Laser (Kurang Nyawa)
            spikes.forEach(s => {
                if (
                    mario.x < s.x + s.width &&
                    mario.x + mario.width > s.x &&
                    mario.y + mario.height >= s.y &&
                    mario.y < s.y + s.height
                ) {
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        resetPosition();
                    }
                }
            });

            // Ambil Koin
            coinList.forEach(c => {
                if (!c.collected &&
                    mario.x < c.x + 20 &&
                    mario.x + mario.width > c.x &&
                    mario.y < c.y + 20 &&
                    mario.y + mario.height > c.y
                ) {
                    c.collected = true;
                    coins++;
                    score += 250;
                }
            });

            // Pergerakan & Tabrakan Musuh
            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                enemy.x += enemy.speed * enemy.direction;
                if (enemy.x < enemy.minX || enemy.x > enemy.maxX) {
                    enemy.direction *= -1;
                }

                if (
                    mario.x < enemy.x + enemy.width &&
                    mario.x + mario.width > enemy.x &&
                    mario.y < enemy.y + enemy.height &&
                    mario.y + mario.height > enemy.y
                ) {
                    if (mario.vy > 0 && mario.y + mario.height - mario.vy <= enemy.y + 12) {
                        enemy.alive = false;
                        mario.vy = -9;
                        score += 150;
                    } else {
                        lives--;
                        if (lives <= 0) {
                            gameOver = true;
                        } else {
                            resetPosition();
                        }
                    }
                }
            });

            // Cek Menang
            if (
                mario.x < flag.x + flag.width &&
                mario.x + mario.width > flag.x &&
                mario.y < flag.y + flag.height &&
                mario.y + mario.height > flag.y
            ) {
                gameWin = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Latar Belakang Bintang Digital
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            for (let i = 100; i < worldWidth; i += 200) {
                ctx.fillRect(i, 50, 3, 3);
                ctx.fillRect(i + 90, 120, 2, 2);
            }

            // Tanah Dasar Cyber
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 310, worldWidth, 90);
            
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.shadowColor = "#00ffcc";
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(0, 310);
            ctx.lineTo(worldWidth, 310);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Gambar Duri Laser Berbahaya
            spikes.forEach(s => {
                ctx.fillStyle = "#ef4444";
                ctx.shadowColor = "#ef4444";
                ctx.shadowBlur = 12;
                ctx.beginPath();
                let spikeCount = 4;
                let w = s.width / spikeCount;
                for (let i = 0; i < spikeCount; i++) {
                    ctx.moveTo(s.x + (i * w), s.y + s.height);
                    ctx.lineTo(s.x + (i * w) + (w / 2), s.y);
                    ctx.lineTo(s.x + ((i + 1) * w), s.y + s.height);
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Platform & Pipa
            platforms.forEach(p => {
                if (p.type === 'pipe') {
                    ctx.fillStyle = "#1e1b4b";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = "#8b5cf6";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#8b5cf6";
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    ctx.fillRect(p.x - 4, p.y, p.width + 8, 16);
                    ctx.strokeRect(p.x - 4, p.y, p.width + 8, 16);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = "#111827";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = "#38bdf8";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#38bdf8";
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    ctx.shadowBlur = 0;
                }
            });

            // Koin Cyber
            coinList.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = "#facc15";
                    ctx.shadowColor = "#facc15";
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(c.x + 10, c.y + 10, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // Musuh Cyber
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    ctx.fillStyle = "#dc2626";
                    ctx.shadowColor = "#ef4444";
                    ctx.shadowBlur = 12;
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "#fff";
                    ctx.fillRect(enemy.x + 6, enemy.y + 8, 6, 6);
                    ctx.fillRect(enemy.x + 20, enemy.y + 8, 6, 6);
                }
            });

            // Tiang Finish
            ctx.fillStyle = "#fff";
            ctx.shadowColor = "#fff";
            ctx.shadowBlur = 10;
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
            
            ctx.fillStyle = "#00ffcc";
            ctx.shadowColor = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(flag.x - 35, flag.y);
            ctx.lineTo(flag.x, flag.y + 18);
            ctx.lineTo(flag.x - 35, flag.y + 36);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Stickman Animasi
            const cx = mario.x + mario.width / 2;
            const cy = mario.y;

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 12;

            // Kepala
            ctx.beginPath();
            ctx.arc(cx, cy + 8, 8, 0, Math.PI * 2);
            ctx.stroke();

            // Badan
            ctx.beginPath();
            ctx.moveTo(cx, cy + 16);
            ctx.lineTo(cx, cy + 32);
            ctx.stroke();

            let swing = Math.sin(mario.animFrame) * 8;

            // Tangan
            ctx.beginPath();
            ctx.moveTo(cx, cy + 20);
            ctx.lineTo(cx - 10 + swing, cy + 28);
            ctx.moveTo(cx, cy + 20);
            ctx.lineTo(cx + 10 - swing, cy + 28);
            ctx.stroke();

            // Kaki
            ctx.beginPath();
            ctx.moveTo(cx, cy + 32);
            ctx.lineTo(cx - 10 - swing, cy + 48);
            ctx.moveTo(cx, cy + 32);
            ctx.lineTo(cx + 10 + swing, cy + 48);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.restore();

            // UI Header Modern
            ctx.fillStyle = "rgba(17, 24, 39, 0.9)";
            ctx.fillRect(15, 15, 380, 42);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(15, 15, 380, 42);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px 'Courier New'";
            ctx.fillText("SCORE: " + score, 25, 41);
            ctx.fillText("COINS: " + coins, 150, 41);
            ctx.fillText("LIVES: " + "❤️ ".repeat(lives), 260, 41);

            // Layar Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 10, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ef4444";
                ctx.shadowColor = "#ef4444";
                ctx.shadowBlur = 15;
                ctx.font = "bold 40px 'Courier New'";
                ctx.fillText("SYSTEM FAILURE", 240, 180);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#94a3b8";
                ctx.font = "16px 'Courier New'";
                ctx.fillText("Tekan SPASI untuk Reboot Game", 255, 230);
            }

            // Layar Menang
            if (gameWin) {
                ctx.fillStyle = "rgba(5, 5, 10, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.shadowColor = "#00ffcc";
                ctx.shadowBlur = 15;
                ctx.font = "bold 40px 'Courier New'";
                ctx.fillText("MISSION COMPLETE", 220, 180);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#94a3b8";
                ctx.font = "16px 'Courier New'";
                ctx.fillText("Tekan SPASI untuk Main Lagi", 270, 230);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
