<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Stickman - Auto Landscape</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Paksa Rotasi Otomatis Landscape di HP Portrait */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            body {
                transform: rotate(90deg);
                transform-origin: bottom left;
                position: absolute;
                top: -100vw;
                left: 0;
                width: 100vh;
                height: 100vw;
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 820px;
            padding: 2px;
        }

        h2 {
            margin: 0 0 2px 0;
            font-size: 11px;
            color: #00ffcc;
            text-shadow: 0 0 4px rgba(0, 255, 204, 0.7);
            letter-spacing: 1px;
        }

        canvas {
            background: linear-gradient(to bottom, #090a16 0%, #1a1c38 100%);
            display: block;
            border-radius: 4px;
            border: 1.5px solid #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            width: 100%;
            height: auto;
            max-height: 60vh;
            object-fit: contain;
        }

        /* Panel Tombol HP (Dijamin Kelihatan & Pas) */
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 4px;
            padding: 0 2px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
        }
        .game-btn {
            background: rgba(30, 41, 59, 0.95);
            border: 1.5px solid #00ffcc;
            color: #00ffcc;
            font-size: 10px;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 4px;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
            cursor: pointer;
        }
        .game-btn:active {
            background: #00ffcc;
            color: #05050a;
        }
        .action-btn {
            border-color: #38bdf8;
            color: #38bdf8;
        }
        .action-btn:active {
            background: #38bdf8;
            color: #05050a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚡ CYBER STICKMAN: AUTO LANDSCAPE ⚡</h2>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Tombol Kontrol Layar Sentuh -->
        <div class="mobile-controls">
            <div class="btn-group">
                <button class="game-btn" id="leftBtn">◀ KIRI</button>
                <button class="game-btn" id="rightBtn">KANAN ▶</button>
            </div>
            <div class="btn-group">
                <button class="game-btn action-btn" id="dashBtn">💨 DASH</button>
                <button class="game-btn action-btn" id="jumpBtn">▲ LOMPAT</button>
                <button class="game-btn action-btn" id="attackBtn">⚔️ TEBAS</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let coins = 0;
        let lives = 3;
        let bossLives = 5;
        let gameOver = false;
        let gameWin = false;
        let hasSword = false;
        let bossFightActive = false;
        
        let playerAttacking = false;
        let playerAttackCooldown = 0;

        let playerFacing = 1; 
        let isDashing = false;
        let dashCooldown = 0;
        let dashTimer = 0;
        
        let bossState = 'hunt';
        let bossTimer = 0;
        let bossVy = 0;
        let bossIsJumping = false;
        let bossAttacking = false;
        let bossDirection = -1;

        const keys = { right: false, left: false, shift: false };

        // Keyboard Listener (PC)
        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowRight") { keys.right = true; playerFacing = 1; }
            if (e.code === "ArrowLeft") { keys.left = true; playerFacing = -1; }
            if (e.code === "ShiftLeft" || e.code === "ShiftRight") { keys.shift = true; }
            
            if (e.code === "ArrowUp" || e.code === "Space") {
                if (gameOver || gameWin) {
                    resetFullGame();
                } else if (e.code === "ArrowUp") {
                    triggerJump();
                } else if (e.code === "Space") {
                    triggerAttack();
                }
                e.preventDefault();
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowRight") keys.right = false;
            if (e.code === "ArrowLeft") keys.left = false;
            if (e.code === "ShiftLeft" || e.code === "ShiftRight") { keys.shift = false; }
        });

        // Touchscreen & Mouse Listener
        const bindTouchButton = (id, actionDown, actionUp) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); actionDown(); }, {passive: false});
            btn.addEventListener("touchend", (e) => { e.preventDefault(); if(actionUp) actionUp(); }, {passive: false});
            btn.addEventListener("mousedown", (e) => { e.preventDefault(); actionDown(); });
            btn.addEventListener("mouseup", (e) => { e.preventDefault(); if(actionUp) actionUp(); });
        };

        bindTouchButton("leftBtn", () => { keys.left = true; playerFacing = -1; }, () => { keys.left = false; });
        bindTouchButton("rightBtn", () => { keys.right = true; playerFacing = 1; }, () => { keys.right = false; });
        bindTouchButton("dashBtn", () => { keys.shift = true; setTimeout(() => { keys.shift = false; }, 200); });
        bindTouchButton("jumpBtn", () => {
            if (gameOver || gameWin) resetFullGame();
            else triggerJump();
        });
        bindTouchButton("attackBtn", () => {
            if (gameOver || gameWin) resetFullGame();
            else triggerAttack();
        });

        function triggerJump() {
            if (!mario.isJumping) {
                mario.vy = mario.jumpPower;
                mario.isJumping = true;
            }
        }

        function triggerAttack() {
            if (!hasSword || !bossFightActive || playerAttackCooldown > 0) return;
            playerAttacking = true;
            playerAttackCooldown = 12;

            let dist = Math.abs((mario.x + mario.width / 2) - (boss.x + boss.width / 2));
            if (dist < 90 && mario.y + mario.height >= boss.y - 25) {
                bossLives--;
                boss.x += (mario.x < boss.x) ? 50 : -50;
                bossVy = -7;
                if (bossLives <= 0) {
                    gameWin = true;
                }
            }

            setTimeout(() => {
                playerAttacking = false;
            }, 120);
        }

        const mario = {
            x: 100,
            y: 200,
            width: 30,
            height: 50,
            speed: 6.0,
            dashSpeed: 14.0,
            vy: 0,
            gravity: 0.58,
            jumpPower: -13.0,
            isJumping: false,
            animFrame: 0
        };

        const boss = {
            x: 4200,
            y: 230,
            width: 30,
            height: 50,
            speed: 3.2,
            animFrame: 0
        };

        let cameraX = 0;
        const worldWidth = 5000;

        const platforms = [
            { x: 300, y: 220, width: 90, height: 20, type: 'block' },
            { x: 420, y: 160, width: 80, height: 20, type: 'block' },
            { x: 570, y: 240, width: 60, height: 80, type: 'pipe' },
            { x: 750, y: 210, width: 120, height: 20, type: 'block' },
            { x: 950, y: 150, width: 90, height: 20, type: 'block' },
            { x: 1120, y: 220, width: 70, height: 100, type: 'pipe' },
            { x: 1300, y: 180, width: 110, height: 20, type: 'block' },
            { x: 1500, y: 130, width: 80, height: 20, type: 'block' },
            { x: 1680, y: 210, width: 65, height: 110, type: 'pipe' },
            { x: 1900, y: 170, width: 130, height: 20, type: 'block' },
            { x: 2150, y: 220, width: 90, height: 20, type: 'block' },
            { x: 2320, y: 150, width: 100, height: 20, type: 'block' },
            { x: 2550, y: 200, width: 70, height: 120, type: 'pipe' },
            { x: 2800, y: 170, width: 120, height: 20, type: 'block' },
            { x: 3050, y: 130, width: 100, height: 20, type: 'block' },
            { x: 3280, y: 210, width: 70, height: 110, type: 'pipe' },
            { x: 3500, y: 170, width: 140, height: 20, type: 'block' },
            { x: 3800, y: 140, width: 100, height: 20, type: 'block' },
            { x: 4100, y: 180, width: 120, height: 20, type: 'block' },
            { x: 4350, y: 220, width: 600, height: 90, type: 'block' }
        ];

        const spikes = [
            { x: 680, y: 290, width: 45, height: 20 },
            { x: 1250, y: 290, width: 45, height: 20 },
            { x: 1820, y: 290, width: 60, height: 20 },
            { x: 2450, y: 290, width: 50, height: 20 },
            { x: 2950, y: 290, width: 55, height: 20 },
            { x: 3680, y: 290, width: 70, height: 20 }
        ];

        let coinList = [
            { x: 320, y: 170, collected: false }, { x: 355, y: 170, collected: false },
            { x: 445, y: 110, collected: false }, { x: 480, y: 110, collected: false },
            { x: 780, y: 160, collected: false }, { x: 820, y: 160, collected: false },
            { x: 975, y: 100, collected: false }, { x: 1330, y: 130, collected: false },
            { x: 1530, y: 80, collected: false },  { x: 1930, y: 120, collected: false },
            { x: 2350, y: 100, collected: false }, { x: 2830, y: 120, collected: false },
            { x: 3080, y: 80, collected: false },  { x: 3530, y: 120, collected: false },
            { x: 3830, y: 90, collected: false },  { x: 4130, y: 130, collected: false }
        ];

        const swordItem = { x: 4000, y: 250, width: 25, height: 20, collected: false };

        let enemies = [
            { x: 500, y: 280, width: 32, height: 32, speed: 1.6, direction: 1, minX: 420, maxX: 650, alive: true },
            { x: 1000, y: 280, width: 32, height: 32, speed: 1.8, direction: -1, minX: 850, maxX: 1100, alive: true },
            { x: 1600, y: 280, width: 32, height: 32, speed: 2.0, direction: 1, minX: 1450, maxX: 1750, alive: true },
            { x: 2200, y: 280, width: 32, height: 32, speed: 2.2, direction: -1, minX: 2000, maxX: 2300, alive: true },
            { x: 2700, y: 280, width: 32, height: 32, speed: 2.1, direction: 1, minX: 2550, maxX: 2850, alive: true },
            { x: 3400, y: 280, width: 32, height: 32, speed: 2.4, direction: -1, minX: 3250, maxX: 3550, alive: true },
            { x: 3950, y: 280, width: 32, height: 32, speed: 2.5, direction: 1, minX: 3800, maxX: 4100, alive: true }
        ];

        function resetPosition() {
            mario.x = 100;
            mario.y = 200;
            mario.vy = 0;
            mario.isJumping = false;
            isDashing = false;
            cameraX = 0;
        }

        function resetFullGame() {
            score = 0;
            coins = 0;
            lives = 3;
            bossLives = 5;
            gameOver = false;
            gameWin = false;
            hasSword = false;
            bossFightActive = false;
            playerAttacking = false;
            playerAttackCooldown = 0;
            isDashing = false;
            dashCooldown = 0;
            bossState = 'hunt';
            bossTimer = 0;
            bossVy = 0;
            bossIsJumping = false;
            bossAttacking = false;
            resetPosition();
            coinList.forEach(c => c.collected = false);
            swordItem.collected = false;
            enemies.forEach(e => e.alive = true);
            boss.x = 4400;
            boss.y = 230;
        }

        function update() {
            if (gameOver || gameWin) return;

            if (playerAttackCooldown > 0) playerAttackCooldown--;
            if (dashCooldown > 0) dashCooldown--;

            if (keys.shift && dashCooldown === 0 && !isDashing) {
                isDashing = true;
                dashTimer = 12;
                dashCooldown = 45;
            }

            let currentSpeed = mario.speed;
            if (isDashing) {
                currentSpeed = mario.dashSpeed;
                dashTimer--;
                if (dashTimer <= 0) {
                    isDashing = false;
                }
            }

            if (keys.right) {
                mario.x += currentSpeed;
                mario.animFrame += isDashing ? 0.6 : 0.3;
            }
            if (keys.left) {
                mario.x -= currentSpeed;
                mario.animFrame += isDashing ? 0.6 : 0.3;
                if (mario.x < 0) mario.x = 0;
            }

            cameraX = mario.x - 250;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            mario.vy += mario.gravity;
            mario.y += mario.vy;

            if (mario.y >= 280) {
                mario.y = 280;
                mario.vy = 0;
                mario.isJumping = false;
            }

            platforms.forEach(p => {
                if (
                    mario.x < p.x + p.width &&
                    mario.x + mario.width > p.x &&
                    mario.y + mario.height >= p.y &&
                    mario.y + mario.height - mario.vy <= p.y
                ) {
                    mario.y = p.y - mario.height;
                    mario.vy = 0;
                    mario.isJumping = false;
                }
            });

            spikes.forEach(s => {
                if (
                    mario.x < s.x + s.width &&
                    mario.x + mario.width > s.x &&
                    mario.y + mario.height >= s.y &&
                    mario.y < s.y + s.height
                ) {
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        resetPosition();
                    }
                }
            });

            coinList.forEach(c => {
                if (!c.collected &&
                    mario.x < c.x + 20 &&
                    mario.x + mario.width > c.x &&
                    mario.y < c.y + 20 &&
                    mario.y + mario.height > c.y
                ) {
                    c.collected = true;
                    coins++;
                    score += 250;
                }
            });

            if (!swordItem.collected &&
                mario.x < swordItem.x + swordItem.width &&
                mario.x + mario.width > swordItem.x &&
                mario.y < swordItem.y + swordItem.height &&
                mario.y + mario.height > swordItem.y
            ) {
                swordItem.collected = true;
                hasSword = true;
                bossFightActive = true;
                score += 500;
            }

            if (bossFightActive) {
                boss.animFrame += 0.3;
                bossTimer++;

                let distToPlayer = (mario.x + mario.width / 2) - (boss.x + boss.width / 2);
                bossDirection = distToPlayer > 0 ? 1 : -1;

                if (bossTimer > 90) {
                    let rand = Math.random();
                    if (rand < 0.5) bossState = 'hunt';
                    else if (rand < 0.8) {
                        bossState = 'jumpAttack';
                        if (!bossIsJumping) {
                            bossVy = -13;
                            bossIsJumping = true;
                        }
                    } else {
                        bossState = 'dash';
                    }
                    bossTimer = 0;
                }

                if (bossState === 'hunt') {
                    boss.x += bossDirection * boss.speed * 1.3;
                } else if (bossState === 'jumpAttack') {
                    boss.x += bossDirection * boss.speed * 1.6;
                } else if (bossState === 'dash') {
                    boss.x += bossDirection * boss.speed * 2.2;
                    bossAttacking = true;
                    setTimeout(() => { bossAttacking = false; }, 250);
                }

                bossVy += mario.gravity;
                boss.y += bossVy;
                if (boss.y >= 230) {
                    boss.y = 230;
                    bossVy = 0;
                    bossIsJumping = false;
                }

                if (boss.x < 0) boss.x = 0;
                if (boss.x > worldWidth - boss.width) boss.x = worldWidth - boss.width;

                if (
                    mario.x < boss.x + boss.width &&
                    mario.x + mario.width > boss.x &&
                    mario.y < boss.y + boss.height &&
                    mario.y + mario.height > boss.y
                ) {
                    lives--;
                    mario.x += (mario.x < boss.x) ? -45 : 45;
                    if (lives <= 0) {
                        gameOver = true;
                    }
                }
            }

            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                enemy.x += enemy.speed * enemy.direction;
                if (enemy.x < enemy.minX || enemy.x > enemy.maxX) {
                    enemy.direction *= -1;
                }

                if (
                    mario.x < enemy.x + enemy.width &&
                    mario.x + mario.width > enemy.x &&
                    mario.y < enemy.y + enemy.height &&
                    mario.y + mario.height > enemy.y
                ) {
                    if (mario.vy > 0 && mario.y + mario.height - mario.vy <= enemy.y + 12) {
                        enemy.alive = false;
                        mario.vy = -10;
                        score += 150;
                    } else {
                        lives--;
                        if (lives <= 0) {
                            gameOver = true;
                        } else {
                            resetPosition();
                        }
                    }
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            for (let i = 100; i < worldWidth; i += 200) {
                ctx.fillRect(i, 50, 3, 3);
                ctx.fillRect(i + 90, 120, 2, 2);
            }

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 310, worldWidth, 90);
            
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.shadowColor = "#00ffcc";
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(0, 310);
            ctx.lineTo(worldWidth, 310);
            ctx.stroke();
            ctx.shadowBlur = 0;

            spikes.forEach(s => {
                ctx.fillStyle = "#ef4444";
                ctx.shadowColor = "#ef4444";
                ctx.shadowBlur = 12;
                ctx.beginPath();
                let spikeCount = 4;
                let w = s.width / spikeCount;
                for (let i = 0; i < spikeCount; i++) {
                    ctx.moveTo(s.x + (i * w), s.y + s.height);
                    ctx.lineTo(s.x + (i * w) + (w / 2), s.y);
                    ctx.lineTo(s.x + ((i + 1) * w), s.y + s.height);
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            platforms.forEach(p => {
                if (p.type === 'pipe') {
                    ctx.fillStyle = "#1e1b4b";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = "#8b5cf6";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#8b5cf6";
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    ctx.fillRect(p.x - 4, p.y, p.width + 8, 16);
                    ctx.strokeRect(p.x - 4, p.y, p.width + 8, 16);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = "#111827";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = "#38bdf8";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#38bdf8";
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    ctx.shadowBlur = 0;
                }
            });

            coinList.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = "#facc15";
                    ctx.shadowColor = "#facc15";
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(c.x + 10, c.y + 10, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            if (!swordItem.collected) {
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 3;
                ctx.shadowColor = "#38bdf8";
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(swordItem.x + 5, swordItem.y + 15);
                ctx.lineTo(swordItem.x + 20, swordItem.y);
                ctx.moveTo(swordItem.x + 2, swordItem.y + 12);
                ctx.lineTo(swordItem.x + 8, swordItem.y + 18);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Boss Render
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            ctx.shadowColor = "#ef4444";
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.arc(boss.x + 15, boss.y + 10, 8, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(boss.x + 15, boss.y + 18);
            ctx.lineTo(boss.x + 15 + (bossDirection * 3), boss.y + 35);
            ctx.stroke();

            let bossSwing = Math.sin(boss.animFrame) * 12;

            ctx.beginPath();
            ctx.moveTo(boss.x + 15, boss.y + 22);
            ctx.lineTo(boss.x + 15 - (bossDirection * 15), boss.y + 30);
            ctx.moveTo(boss.x + 15, boss.y + 22);
            ctx.lineTo(boss.x + 15 + (bossDirection * 20), boss.y + 25);
            ctx.stroke();

            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 4;
            ctx.beginPath();
            if (bossAttacking) {
                ctx.moveTo(boss.x + 15, boss.y + 25);
                ctx.lineTo(boss.x + 15 + (bossDirection * 40), boss.y + 25);
            } else {
                ctx.moveTo(boss.x + 15 + (bossDirection * 15), boss.y + 25);
                ctx.lineTo(boss.x + 15 + (bossDirection * 32), boss.y + 12);
            }
            ctx.stroke();

            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(boss.x + 15, boss.y + 35);
            ctx.lineTo(boss.x + 8 - bossSwing, boss.y + 50);
            ctx.moveTo(boss.x + 15, boss.y + 35);
            ctx.lineTo(boss.x + 22 + bossSwing, boss.y + 50);
            ctx.stroke();

            ctx.shadowBlur = 0;

            ctx.fillStyle = "#ef4444";
            ctx.font = "bold 12px 'Courier New'";
            ctx.fillText("BOSS HP: " + "❤️ ".repeat(bossLives), boss.x - 30, boss.y - 12);

            enemies.forEach(enemy => {
                if (enemy.alive) {
                    ctx.fillStyle = "#dc2626";
                    ctx.shadowColor = "#ef4444";
                    ctx.shadowBlur = 12;
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "#fff";
                    ctx.fillRect(enemy.x + 6, enemy.y + 8, 6, 6);
                    ctx.fillRect(enemy.x + 20, enemy.y + 8, 6, 6);
                }
            });

            // Player Render
            ctx.strokeStyle = isDashing ? "#00ffcc" : "#ffffff";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            ctx.shadowColor = isDashing ? "#00ffcc" : "#ffffff";
            ctx.shadowBlur = isDashing ? 20 : 12;

            ctx.beginPath();
            ctx.arc(mario.x + 15, mario.y + 10, 8, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(mario.x + 15, mario.y + 18);
            ctx.lineTo(mario.x + 15 + (playerFacing * 3), mario.y + 35);
            ctx.stroke();

            let swing = Math.sin(mario.animFrame) * 10;

            ctx.beginPath();
            ctx.moveTo(mario.x + 15, mario.y + 22);
            ctx.lineTo(mario.x + 5 + swing, mario.y + 30);
            ctx.moveTo(mario.x + 15, mario.y + 22);
            ctx.lineTo(mario.x + 25 - swing, mario.y + 30);
            ctx.stroke();

            if (hasSword) {
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 4;
                ctx.beginPath();
                if (playerAttacking) {
                    ctx.moveTo(mario.x + 15, mario.y + 25);
                    ctx.lineTo(mario.x + (playerFacing === 1 ? 45 : -15), mario.y + 25);
                } else {
                    ctx.moveTo(mario.x + 20, mario.y + 28);
                    ctx.lineTo(mario.x + (playerFacing === 1 ? 35 : -5), mario.y + 15);
                }
                ctx.stroke();
                ctx.strokeStyle = isDashing ? "#00ffcc" : "#ffffff";
                ctx.lineWidth = 3.5;
            }

            ctx.beginPath();
            ctx.moveTo(mario.x + 15, mario.y + 35);
            ctx.lineTo(mario.x + 6 - swing, mario.y + 50);
            ctx.moveTo(mario.x + 15, mario.y + 35);
            ctx.lineTo(mario.x + 24 + swing, mario.y + 50);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.restore();

            // HUD UI Scoreboard
            ctx.fillStyle = "rgba(17, 24, 39, 0.9)";
            ctx.fillRect(15, 15, 430, 42);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(15, 15, 430, 42);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px 'Courier New'";
            ctx.fillText("SCORE: " + score, 25, 41);
            ctx.fillText("COINS: " + coins, 135, 41);
            ctx.fillText("LIVES: " + "❤️ ".repeat(lives), 235, 41);
            ctx.fillStyle = dashCooldown === 0 ? "#00ffcc" : "#94a3b8";
            ctx.fillText(dashCooldown === 0 ? "DASH [READY]" : "DASH [CD]", 350, 41);

            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 10, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ef4444";
                ctx.shadowColor = "#ef4444";
                ctx.shadowBlur = 15;
                ctx.font = "bold 35px 'Courier New'";
                ctx.fillText("DIKALAHKAN BOSS", 210, 180);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#94a3b8";
                ctx.font = "14px 'Courier New'";
                ctx.fillText("Sentuh Tombol untuk Ulangi", 290, 230);
            }

            if (gameWin) {
                ctx.fillStyle = "rgba(5, 5, 10, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.shadowColor = "#00ffcc";
                ctx.shadowBlur = 15;
                ctx.font = "bold 35px 'Courier New'";
                ctx.fillText("VICTORY! BOSS DIKALAHKAN", 140, 160);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px 'Courier New'";
                ctx.fillText("Duel Pedang Berhasil Dimenangkan!", 220, 200);
                ctx.fillStyle = "#94a3b8";
                ctx.font = "14px 'Courier New'";
                ctx.fillText("Sentuh Tombol untuk Main Lagi", 270, 240);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
